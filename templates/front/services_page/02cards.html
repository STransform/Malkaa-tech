{% load i18n %} {% load static %}<!-- CSS -->
{% block css %}<style>
  .cards-section {
    background: linear-gradient(135deg, #f8fcff 0%, #e6f3ff 100%);
    position: relative;
    padding: 100px 0;
  }

  .cards-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 119, 190, 0.3), transparent);
  }

  .service-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(0, 119, 190, 0.08);
    transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(0, 119, 190, 0.1);
    height: 100%;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0077BE, rgba(0, 119, 190, 0.6));
    border-radius: 24px 24px 0 0;
  }

  .service-card:hover {
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 25px 60px rgba(0, 119, 190, 0.15);
    border-color: rgba(0, 119, 190, 0.2);
  }

  .card-image-wrapper {
    position: relative;
    height: 220px;
    overflow: hidden;
  }

  .card-image-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(0, 119, 190, 0.1) 0%, rgba(0, 90, 143, 0.05) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .service-card:hover .card-image-wrapper::after {
    opacity: 1;
  }

  .card-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .service-card:hover .card-image-wrapper img {
    transform: scale(1.1) rotate(1deg);
  }

  .card-content {
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    height: calc(100% - 220px);
    min-height: 300px;
    position: relative;
  }

  .card-header-section {
    margin-bottom: 1.5rem;
    position: relative;
  }

  .card-title {
    color: #005a8f;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    line-height: 1.3;
    transition: color 0.3s ease;
  }

  .service-card:hover .card-title {
    color: #0077BE;
  }

  .title-accent {
    width: 50px;
    height: 4px;
    background: linear-gradient(90deg, #0077BE, rgba(0, 119, 190, 0.7));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .service-card:hover .title-accent {
    width: 70px;
  }

  .card-body-section {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .content-wrapper {
    position: relative;
    flex: 1;
  }

  .card-text {
    color: #0066a3;
    line-height: 1.8;
    font-size: 1rem;
    text-align: justify;
    margin-bottom: 1.5rem;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 8.5em;
    transition: all 0.4s ease;
    opacity: 0.95;
  }

  .card-text.expanded {
    -webkit-line-clamp: unset;
    max-height: none;
    overflow: visible;
    opacity: 1;
  }

  .readmore-controls {
    margin-top: auto;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .service-card:hover .readmore-controls {
    opacity: 1;
  }

  .read-more-btn {
    color: #0077BE;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
  }

  .read-more-btn:hover {
    color: #005a8f;
    transform: translateX(5px);
  }

  .read-more-icon {
    transition: transform 0.3s ease;
  }

  .read-more-btn:hover .read-more-icon {
    transform: translateY(2px);
  }

  @media (max-width: 768px) {
    .cards-section {
      padding: 80px 0;
    }

    .card-content {
      padding: 2rem;
      min-height: 280px;
    }

    .card-image-wrapper {
      height: 200px;
    }

    .card-title {
      font-size: 1.4rem;
    }

    .card-text {
      font-size: 0.95rem;
      -webkit-line-clamp: 4;
      max-height: 6.8em;
    }
  }

  @media (max-width: 576px) {
    .cards-section {
      padding: 60px 0;
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-image-wrapper {
      height: 180px;
    }
  }

  .appear-animation {
    opacity: 0;
    transform: translateY(40px);
    animation: fadeInUpShorter 1s ease forwards;
  }

  @keyframes fadeInUpShorter {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .appear-animation:nth-child(1) { animation-delay: 0.1s; }
  .appear-animation:nth-child(2) { animation-delay: 0.2s; }
  .appear-animation:nth-child(3) { animation-delay: 0.3s; }
  .appear-animation:nth-child(4) { animation-delay: 0.4s; }
  .appear-animation:nth-child(5) { animation-delay: 0.5s; }
  .appear-animation:nth-child(6) { animation-delay: 0.6s; }
</style>
{% endblock %}<!-- Improved Cards -->
<div class="cards-section py-5">
  <div id="examples" class="container">
    <div class="row g-4">
      {% for service in services %}
      <div class="col-lg-4 col-md-6 appear-animation" data-appear-animation="fadeInUpShorter" data-appear-animation-delay="300">
        <div class="service-card h-100">
          {% if service.image_url %}
          <div class="card-image-wrapper">
            <img src="{{ service.image_url }}" class="card-img-top" alt="{{ service.title }}">
          </div>
          {% endif %}

      <div class="card-content">
        <div class="card-header-section">
          <h3 class="card-title">{{ service.title }}</h3>
          <div class="title-accent"></div>
        </div>

        <div class="card-body-section">
          <div class="content-wrapper">
            <p class="card-text" id="card-text-{{ forloop.counter }}">{{ service.content }}</p>

            <div class="readmore-controls" id="readmore-{{ forloop.counter }}">
              <a href="javascript:void(0)" class="read-more-btn" onclick="toggleReadMore('{{ forloop.counter }}')">
                <span class="read-more-text">{% trans "Read More" %}</span>
                <i class="fas fa-chevron-down ms-1 read-more-icon"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>  </div>
</div>

{% block js %}<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Check each card text for overflow
    document.querySelectorAll('.card-text').forEach(function (textElement, index) {
      const cardId = index + 1;
      const readMoreControl = document.getElementById('readmore-' + cardId);

      // Check if text is overflowing
      if (textElement.scrollHeight > textElement.clientHeight) {
        readMoreControl.style.display = 'block';
      }
    });
  });

  function toggleReadMore(cardId) {
    const textElement = document.getElementById('card-text-' + cardId);
    const readMoreBtn = document.querySelector('#readmore-' + cardId + ' .read-more-btn');
    const readMoreText = readMoreBtn.querySelector('.read-more-text');
    const readMoreIcon = readMoreBtn.querySelector('.read-more-icon');

    if (textElement.classList.contains('expanded')) {
      // Collapse text
      textElement.classList.remove('expanded');
      readMoreText.textContent = '{% trans "Read More" %}';
      readMoreIcon.className = 'fas fa-chevron-down ms-1 read-more-icon';
    } else {
      // Expand text
      textElement.classList.add('expanded');
      readMoreText.textContent = '{% trans "Read Less" %}';
      readMoreIcon.className = 'fas fa-chevron-up ms-1 read-more-icon';
    }

    return false;
  }
</script>
{% endblock %}
