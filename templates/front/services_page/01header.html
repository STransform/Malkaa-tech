{% load i18n %} {% load static %}<!-- CSS -->
{% block css %}<style>
  .hero-header {
    background: linear-gradient(135deg, #f8fcff 0%, #e6f3ff 100%);
    padding: 120px 0;
    position: relative;
    overflow: hidden;
    min-height: 400px;
    display: flex;
    align-items: center;
  }

  .hero-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(0, 119, 190, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }

  .hero-header::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0, 119, 190, 0.05) 0%, transparent 70%);
    border-radius: 50%;
    animation: float 8s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }

  .header-content {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .header-title {
    color: #005a8f;
    font-weight: 800;
    font-size: 4rem;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
    line-height: 1.1;
    position: relative;
    text-shadow: 0 2px 10px rgba(0, 119, 190, 0.1);
  }

  .header-accent-line {
    width: 100px;
    height: 5px;
    background: linear-gradient(90deg, #0077BE, rgba(0, 119, 190, 0.6));
    border-radius: 3px;
    box-shadow: 0 4px 12px rgba(0, 119, 190, 0.2);
    margin: 0 auto 2rem;
    transition: width 0.4s ease;
  }

  .header-content:hover .header-accent-line {
    width: 120px;
  }

  .header-subtitle {
    color: #0066a3;
    font-weight: 400;
    font-size: 1.25rem;
    margin-bottom: 0;
    opacity: 0.9;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .hero-header {
      min-height: 300px;
      padding: 80px 0;
    }

    .header-title {
      font-size: 2.8rem;
    }

    .header-accent-line {
      width: 80px;
      height: 4px;
    }
  }

  @media (max-width: 576px) {
    .header-title {
      font-size: 2.2rem;
    }

    .header-subtitle {
      font-size: 1.1rem;
    }
  }
</style>
{% endblock %}<!-- Improved Header -->
<section class="hero-header py-5 m-0">
  <div class="container">
    <div class="row justify-content-center text-center">
      <div class="col-lg-8">
        <div class="header-content">
          <h1 class="display-3 fw-bold mb-3 header-title">{{ page_title }}</h1>
          <div class="header-accent-line mx-auto"></div>
          <p class="lead mt-4 header-subtitle">{{ page_subtitle }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
