{% load i18n %}
{% load static %}

{% block css %}
<style>
  .faq-section {
    padding: 120px 0;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    position: relative;
    overflow: hidden;
  }

  .faq-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.05"/><circle cx="75" cy="75" r="1.5" fill="white" opacity="0.03"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grain)"/></svg>') repeat;
    pointer-events: none;
  }

  .faq-header {
    text-align: center;
    margin-bottom: 60px;
    position: relative;
    z-index: 2;
  }

  .faq-header h2 {
    font-size: 3.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #0077BE 0%, #00A8E8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .faq-header p {
    font-size: 1.25rem;
    color: #6c757d;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .faq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .faq-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .faq-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }

  .faq-question {
    padding: 32px 32px 24px;
    cursor: pointer;
    position: relative;
    font-weight: 600;
    font-size: 1.1rem;
    color: #2c3e50;
    transition: color 0.3s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .faq-card:hover .faq-question {
    color: #0077BE;
  }

  .faq-icon {
    width: 20px;
    height: 20px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .faq-card.active .faq-icon {
    transform: rotate(180deg);
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, padding 0.4s ease-out;
    background: linear-gradient(180deg, rgba(0, 119, 190, 0.02) 0%, transparent 100%);
  }

  .faq-card.active .faq-answer {
    max-height: 300px;
    padding: 0 32px 32px;
  }

  .faq-answer p {
    margin: 0;
    color: #0077BE;
    line-height: 1.7;
    font-size: 1rem;
  }

  @media (max-width: 768px) {
    .faq-section {
      padding: 80px 0;
    }

    .faq-header h2 {
      font-size: 2.5rem;
    }

    .faq-grid {
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 0 20px;
    }

    .faq-card {
      border-radius: 16px;
    }

    .faq-question,
    .faq-answer {
      padding-left: 24px;
      padding-right: 24px;
    }
  }

  /* Custom checkbox for accessibility */
  .faq-toggle {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
</style>
{% endblock %}

{% if faqs %}
<section class="faq-section">
  <div class="container">
    <div class="faq-header">
      <h2 class="section-title">{% trans "FAQs" %}</h2>
      <p class="lead" style="color:#0077BE ;">{% trans "OUR ANSWERS FOR THE MOST QUESTIONS WE GET" %}</p>
    </div>
    <div class="faq-grid">
      {% for faq in faqs %}
      <div class="faq-card">
        <label class="faq-question" for="faq-toggle-{{ forloop.counter }}">
          <span>{{ faq.question }}</span>
          <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </label>
        <input type="checkbox" id="faq-toggle-{{ forloop.counter }}" class="faq-toggle">
        <div class="faq-answer">
          <p>{{ faq.answer|linebreaks }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggles = document.querySelectorAll('.faq-toggle');
  toggles.forEach(toggle => {
    toggle.addEventListener('change', function() {
      const card = this.closest('.faq-card');
      card.classList.toggle('active', this.checked);
    });
  });

  // Close all others when one is opened (accordion behavior)
  toggles.forEach(toggle => {
    toggle.addEventListener('change', function() {
      if (this.checked) {
        toggles.forEach(other => {
          if (other !== this) {
            other.checked = false;
            other.closest('.faq-card').classList.remove('active');
          }
        });
      }
    });
  });
});
</script>
{% endif %}
