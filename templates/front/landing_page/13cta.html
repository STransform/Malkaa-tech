{% load i18n %}
{% load static %}

{% block css %}
<style>
  .cta-section {
    padding: 100px 0;
    background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 50%, #0077BE 100%);
    position: relative;
    overflow: hidden;
  }

  .cta-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 20% 80%, rgba(0, 119, 190, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(0, 168, 232, 0.15) 0%, transparent 50%);
    pointer-events: none;
    animation: shimmer 15s ease-in-out infinite alternate;
  }

  @keyframes shimmer {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .cta-section .container {
    position: relative;
    z-index: 2;
  }

  .cta-content {
    text-align: center;
  }

  .cta-title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff, #e2e8f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .cta-subtitle {
    font-size: 1.25rem;
    color: #cbd5e1;
    margin-bottom: 2.5rem;
    line-height: 1.6;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 768px) {
    .cta-title {
      font-size: 2.25rem;
    }

    .cta-subtitle {
      font-size: 1.1rem;
    }

    .cta-section {
      padding: 80px 0;
    }
  }
</style>
{% endblock %}
