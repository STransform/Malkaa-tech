{% load i18n %}
{% load static %}
{% block css %}<style>
  :root {
    --primary-blue: #0077BE;
    --primary-white: #ffffff;
    --medium-gray: #6c757d;
    --primary-black: #212529;
    --light-gray: #f8f9fa;
  }  .about-content {
    background: linear-gradient(135deg, var(--primary-white) 0%, var(--light-gray) 100%);
    padding: 100px 0;
    position: relative;
    overflow: hidden;
  }  .about-content::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, var(--primary-blue) 0%, transparent 70%);
    opacity: 0.05;
    border-radius: 50%;
    transform: translate(20%, -20%);
    z-index: 1;
  }  .about-title {
    font-family: "Playfair Display", serif;
    font-size: 3.5rem;
    font-weight: 700;
    color: #0077BE;
    margin-bottom: 2.5rem;
    position: relative;
    text-align: center;
    line-height: 1.2;
    z-index: 2;
    display: inline-block;
  }  .about-title::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #0077BE, transparent);
    border-radius: 2px;
  }  .about-row {
    position: relative;
    z-index: 2;
  }  .about-text-section {
    padding-right: 3rem;
  }  .about-text-highlight {
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--primary-blue);
    margin-bottom: 2rem;
    line-height: 1.5;
    transition: color 0.3s ease;
    position: relative;
    display: inline-block;
  }  .about-text-highlight::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #0077BE, transparent);
    border-radius: 2px;
  }  .about-text-highlight:hover {
    color: #005a94;
  }  .about-description {
    color: var(--medium-gray);
    line-height: 1.7;
    font-size: 1.1rem;
    margin-bottom: 0;
  }  .image-gallery-container {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 119, 190, 0.1);
    transition: all 0.4s ease;
    height: 450px;
    display: flex;
    align-items: center;
    justify-content: center;
  }  .image-gallery-container:hover {
    transform: scale(1.02);
    box-shadow: 0 25px 50px rgba(0, 119, 190, 0.15);
  }  .image-gallery {
    position: relative;
    width: 100%;
    height: 100%;
  }  .gallery-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: all 0.4s ease;
    border-radius: 20px;
  }  .gallery-image::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(0, 119, 190, 0.1) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
    border-radius: 20px;
  }  .image-gallery-container:hover .gallery-image::after {
    opacity: 1;
  }  @media
 (max-width: 768px) {
    .about-content {
      padding: 60px 0;
    }.about-title {
  font-size: 2.8rem;
}

.about-text-section {
  padding-right: 0;
  margin-bottom: 2.5rem;
}

.about-text-highlight {
  font-size: 1.4rem;
}

.about-description {
  font-size: 1rem;
}

.image-gallery-container {
  height: 300px;
  margin-top: 2rem;
}  }
</style>
{% endblock %}<!-- About Our Purpose --><section class="about-content">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="about-title appear-animation" data-appear-animation="fadeInUp" data-appear-animation-delay="200">
          {% trans "About Malkaa tech" %}
        </h2>
      </div>
    </div>
    <div class="row about-row align-items-center">
      <div class="col-lg-6 about-text-section">
        <div class="about-text-highlight appear-animation" data-appear-animation="fadeInLeft" data-appear-animation-delay="400">
          {{ about_data.title }}
        </div>
        <p class="about-description otech-font appear-animation" data-appear-animation="fadeInLeft" data-appear-animation-delay="500">
          {{ about_data.content }}
        </p>
      </div>

  <div class="col-lg-6">
    <div class="image-gallery-container appear-animation" data-appear-animation="fadeInRight" data-appear-animation-delay="600">
      <div class="image-gallery">
        {% if about_data.image_one %}
        <img src="{{ about_data.image_one.url }}" class="gallery-image" alt="About Image" />
        {% endif %}
      </div>
    </div>
  </div>
</div>  </div>
</section>
