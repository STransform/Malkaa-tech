{% load i18n %} {% load static %}{% block css %}<style>
  .blog-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 0;
    text-align: left;
    transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    height: 100%;
    box-shadow: 0 12px 48px rgba(0, 119, 190, 0.08);
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(0, 119, 190, 0.1);
  }

  .blog-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0077BE, rgba(0, 119, 190, 0.6));
    border-radius: 24px 24px 0 0;
  }

  .blog-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 60px rgba(0, 119, 190, 0.15);
    border-color: rgba(0, 119, 190, 0.2);
  }

  .blog-image-wrapper {
    position: relative;
    padding-bottom: 60%;
    height: 0;
    overflow: hidden;
    border-radius: 24px 24px 0 0;
  }

  .blog-image-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(0, 119, 190, 0.1) 0%, rgba(0, 90, 143, 0.05) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .blog-card:hover .blog-image-wrapper::after {
    opacity: 1;
  }

  .blog-image-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .blog-card:hover .blog-image-wrapper img {
    transform: scale(1.1);
  }

  .blog-content {
    padding: 30px 25px;
    position: relative;
  }

  .blog-meta {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .blog-meta span {
    color: #0066a3;
    font-weight: 500;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.3s ease;
  }

  .blog-card:hover .blog-meta span {
    color: #0077BE;
  }

  .blog-meta i {
    color: #0077BE;
    font-size: 0.95rem;
  }

  .blog-title {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    color: #005a8f;
    margin-bottom: 15px;
    line-height: 1.4;
    transition: color 0.3s ease;
    font-size: 1.5rem;
  }

  .blog-card:hover .blog-title {
    color: #0077BE;
  }

  .blog-title a {
    text-decoration: none;
    color: inherit;
    transition: color 0.3s ease;
  }

  .blog-title a:hover {
    color: #0077BE;
  }

  .blog-excerpt {
    color: #0066a3;
    line-height: 1.6;
    margin-bottom: 20px;
    overflow: hidden;
    height: 90px;
    opacity: 0.95;
    transition: opacity 0.3s ease;
  }

  .blog-card:hover .blog-excerpt {
    opacity: 1;
  }

  .btn-corporate-red {
    background: linear-gradient(135deg, #0077BE, rgba(0, 119, 190, 0.8));
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 0.75rem 1.5rem;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: all 0.4s ease;
    display: inline-flex;
    align-items: center;
    box-shadow: 0 4px 16px rgba(0, 119, 190, 0.2);
    position: relative;
    overflow: hidden;
  }

  .btn-corporate-red::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
  }

  .btn-corporate-red:hover::before {
    left: 100%;
  }

  .btn-corporate-red:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 24px rgba(0, 119, 190, 0.3);
    color: #ffffff;
  }

  .btn-corporate-red i {
    margin-left: 0.5rem;
    transition: transform 0.4s ease;
  }

  .btn-corporate-red:hover i {
    transform: translateX(4px);
  }

  @media (max-width: 768px) {
    .blog-card {
      margin-bottom: 2rem;
    }

    .blog-content {
      padding: 25px 20px;
    }

    .blog-title {
      font-size: 1.3rem;
    }

    .blog-meta {
      gap: 1rem;
      flex-direction: column;
      align-items: flex-start;
    }
  }

  @media (max-width: 576px) {
    .blog-content {
      padding: 20px 15px;
    }

    .blog-meta {
      gap: 0.75rem;
    }
  }
</style>
{% endblock %}{% if blog %}<div class="col-lg-4 col-md-6">
  <article class="blog-card h-100">
    <div class="blog-image-wrapper">
      <a href="{% url 'blog_detail' blog_id=blog.id %}">
        <img src="{{blog.images.url}}" alt="{{blog.title}}" class="img-fluid blog-image" />
      </a>
    </div>

<div class="blog-content">
  <div class="blog-meta mb-3">
    <span><i class="far fa-calendar-alt"></i>{{blog.created_date}}</span>
    <span><i class="far fa-user"></i>{% trans "By" %} {{blog.created_by}}</span>
    <span><i class="far fa-comments"></i>{{blog.comments.count}} {% trans "Comments" %}</span>
  </div>

  <h5 class="blog-title">
    <a href="{% url 'blog_detail' blog_id=blog.id %}" style="text-decoration: none; color: inherit;">
      {{blog.title|truncatechars:50}}
    </a>
  </h5>

  <p class="blog-excerpt">{{blog.content|truncatechars:130}}</p>

  <a href="{% url 'blog_detail' blog_id=blog.id %}" class="btn-corporate-red">
    {% trans "Read More" %} <i class="fa fa-angle-right"></i>
  </a>
</div>  </article>
</div>
{% endif %}
