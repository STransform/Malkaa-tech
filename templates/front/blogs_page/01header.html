{% load i18n %} {% load static %}<!-- CSS -->
{% block css %}<style>
  .hero-header {
    background: linear-gradient(135deg, #f8fcff 0%, #e6f3ff 100%);
    padding: 140px 0;
    position: relative;
    overflow: hidden;
    min-height: 450px;
    display: flex;
    align-items: center;
  }

  .hero-header::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -15%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0, 119, 190, 0.08) 0%, transparent 70%);
    border-radius: 50%;
    animation: float 7s ease-in-out infinite;
  }

  .hero-header::after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -10%;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(0, 119, 190, 0.05) 0%, transparent 70%);
    border-radius: 50%;
    animation: float 9s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(180deg); }
  }

  .header-content {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .header-title {
    color: #005a8f;
    font-weight: 800;
    font-size: 4.5rem;
    letter-spacing: -0.04em;
    margin-bottom: 2rem;
    line-height: 1.1;
    position: relative;
    text-shadow: 0 4px 16px rgba(0, 119, 190, 0.1);
  }

  .header-accent-line {
    width: 120px;
    height: 6px;
    background: linear-gradient(90deg, #0077BE, rgba(0, 119, 190, 0.7));
    border-radius: 3px;
    box-shadow: 0 6px 16px rgba(0, 119, 190, 0.25);
    margin: 0 auto 2.5rem;
    transition: width 0.5s ease;
  }

  .header-content:hover .header-accent-line {
    width: 150px;
  }

  .header-subtitle {
    color: #0066a3;
    font-weight: 400;
    font-size: 1.3rem;
    margin-bottom: 0;
    opacity: 0.92;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .hero-header {
      min-height: 350px;
      padding: 100px 0;
    }

    .header-title {
      font-size: 3.2rem;
    }

    .header-accent-line {
      width: 100px;
      height: 5px;
    }
  }

  @media (max-width: 576px) {
    .header-title {
      font-size: 2.5rem;
    }

    .header-subtitle {
      font-size: 1.15rem;
    }
  }
</style>
{% endblock %}<!-- Header -->
<section class="hero-header py-5 pb-3 m-0">
  <div class="container">
    <div class="row justify-content-center text-center">
      <div class="col-lg-8">
        <div class="header-content">
          <h1 class="display-2 fw-bold mb-3 header-title">{{ page_title }}</h1>
          <div class="header-accent-line mx-auto"></div>
          <p class="lead mt-4 header-subtitle">{{ page_subtitle }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
